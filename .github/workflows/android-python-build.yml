name: Build Vooc Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-python/**"
      - ".github/workflows/android-python-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: android-python/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev automake ccache

      - name: Cache Buildozer SDK/NDK downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-python/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0" numpy

      - name: Check Python syntax
        working-directory: android-python
        run: python -m compileall -q main.py vooc tests

      - name: Run DSP and pipeline tests
        working-directory: android-python
        run: python -m unittest discover -s tests -v

      - name: Use the repository's fixed debug signing key
        # Every CI run would otherwise create a new random debug key, and Android
        # refuses to install an update signed with a different key
        # ("App not installed"). A fixed key lets new APKs install over old ones.
        run: |
          mkdir -p ~/.android
          cp android-python/ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android-python
        env:
          P4A_RELEASE_KEYSTORE: ""
          PIP_CONSTRAINT: ${{ github.workspace }}/android-python/constraints-android.txt
        run: yes | buildozer -v android debug

      - name: Verify APK install package and signature
        working-directory: android-python
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$HOME/.buildozer" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$HOME/.buildozer" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/vooc-badging.txt
          grep -F "package: name='com.jhaa2k.vooc' versionCode='2' versionName='1.1'" /tmp/vooc-badging.txt
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'24'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vooc-debug-apk
          path: android-python/bin/*.apk
          if-no-files-found: error
          retention-days: 14
