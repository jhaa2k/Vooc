name: Vooc emulator smoke test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/scripts/emulator_smoke.sh"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ["${{ inputs.ref || github.sha }}", "bded70e"]
    steps:
      - name: Checkout tested app
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Checkout smoke script
        uses: actions/checkout@v4
        with:
          path: smoke-tools

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev automake ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0" numpy

      - name: Build x86_64 debug APK
        working-directory: android-python
        env:
          APP_ANDROID_ARCHS: x86_64
          PIP_CONSTRAINT: ${{ github.workspace }}/android-python/constraints-android.txt
        run: |
          sed -i 's/^android.archs.*/android.archs = x86_64/' buildozer.spec
          yes | buildozer android debug > build.log 2>&1 || (tail -200 build.log; exit 1)
          tail -5 build.log; ls -la bin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash smoke-tools/.github/scripts/emulator_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke-out
