name: Vooc emulator smoke test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: this commit)"
        required: false
        default: ""
      apk_run_id:
        description: "Test the vooc-debug-apk artifact of this Build run id instead of building"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/scripts/emulator_smoke.sh"

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev automake ccache
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0" numpy
      - name: Build arm64 + x86_64 debug APK
        working-directory: android-python
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/android-python/constraints-android.txt
        run: |
          sed -i 's/^android.archs.*/android.archs = arm64-v8a, x86_64/' buildozer.spec
          yes | buildozer android debug > build.log 2>&1 || (tail -300 build.log; exit 1)
          ls -la bin
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: android-python/bin/*.apk

  emulator-x86:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.apk_run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.apk_run_id }}
        with:
          name: smoke-apk
          path: apk
      - uses: actions/download-artifact@v4
        if: ${{ inputs.apk_run_id }}
        with:
          name: vooc-debug-apk
          path: apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-x86-api${{ matrix.api }}
          path: smoke-out

