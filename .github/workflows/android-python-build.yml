name: Build Vooc Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-python/**"
      - ".github/workflows/android-python-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: android-python/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Check Python syntax
        working-directory: android-python
        run: python -m compileall -q main.py vooc tests

      - name: Run DSP and pipeline tests
        working-directory: android-python
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        working-directory: android-python
        env:
          P4A_RELEASE_KEYSTORE: ""
          PIP_CONSTRAINT: ${{ github.workspace }}/android-python/constraints-android.txt
        run: buildozer -v android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vooc-debug-apk
          path: android-python/bin/*.apk
          if-no-files-found: error
          retention-days: 14
